[project]
name = "multimodal-alzheimer-classification"
version = "0.1.0"
description = "Multimodal Alzheimer's Disease Classification with Heterogeneous Graph Neural Networks, Kolmogorov-Arnold Networks (KAN), and FMA Ontology Knowledge Graphs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.2.0",
    "captum>=0.7.0",
    "click>=8.1.7",
    "matplotlib>=3.8.0",
    "networkx>=3.2.0",
    "nibabel>=5.2.0",
    "nilearn>=0.10.4",
    "nipype>=1.8.6",
    "numpy>=1.26.0",
    "optuna>=3.6.0",
    "owlready2>=0.46",
    "pandas>=2.2.0",
    "pydicom>=2.4.0",
    "rdflib>=7.0.0",
    "ruamel-yaml>=0.18.6",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "seaborn>=0.13.0",
    "simpleitk>=2.3.0",
    "torch>=2.2.0",
    "torch-geometric>=2.5.0",
    "torchmetrics>=1.4.0",
    "tqdm>=4.66.0",
    "transformers>=4.40.0",
    "xgboost>=2.0.0",
]

