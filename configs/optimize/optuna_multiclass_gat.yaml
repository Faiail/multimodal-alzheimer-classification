general:
  out_dir: models/optimize/optuna_multiclass_gat
  seed: 42

study:
  study:
    direction: maximize
    study_name: optuna_multiclass_gat
  optimizer:
    n_trials: 30
  metric_to_watch: balanced_accuracy
  mapping:
    plain:
      hidden_dim: hidden_dim
      dropout: dropout
      num_gnn_layers: num_gnn_layers
      grid_size: grid_size
    optimizer:
      lr: lr
      weight_decay: weight_decay

hspace:
  hidden_dim:
    name: suggest_categorical
    config:
      name: hidden_dim
      choices: [32, 64, 128]
  dropout:
    name: suggest_float
    config:
      name: dropout
      low: 0.1
      high: 0.5
  num_gnn_layers:
    name: suggest_int
    config:
      name: num_gnn_layers
      low: 1
      high: 3
  grid_size:
    name: suggest_categorical
    config:
      name: grid_size
      choices: [3, 5, 8]
  lr:
    name: suggest_float
    config:
      name: lr
      low: 0.0001
      high: 0.003
      log: true
  weight_decay:
    name: suggest_float
    config:
      name: weight_decay
      low: 0.00001
      high: 0.001
      log: true

run:
  name: AlzheimerGNNRun
  config:
    general:
      out_dir: models/optimize/optuna_multiclass_gat/default
      device: cuda:0
      pbar: false
      num_epochs: 120
      n_splits: 5
      seed: 42
      task: multiclass
      save_plots: false
    data:
      features_file: data/processed/all_features.csv
      clinical_file: data/processed/multiclass_cn_mci_ad_features.csv
      coords_file: configs/aal3_coordinates.csv
      ontology_lookup_file: configs/aal3_ontology_lookup.csv
      ontology_kg_file: configs/fma_knowledge_graph.json
      target_col: target
      tabular_cols: [AGE, Gender_Male, PTEDUCAT, APOE4, MMSE, ABETA_final, TAU_final, PTAU_final, CSF_Available]
      sigma: 25.0
      graph_mode: multigraph
      knn_k: 10
      zhang_threshold: 0.5
      graph_mix_alpha: 0.5
      use_semantic_features: true
      use_fma_graph: true
    loader:
      batch_size: 16
      num_workers: 4
    model:
      name: GAT_KAN_Classifier
      config:
        num_nodes: 166
        hidden_dim: 64
        out_classes: 3
        dropout: 0.3
        grid_size: 5
        spline_order: 3
        num_gnn_layers: 2
        head_type: kan
        gnn_layer_type: standard
        use_hierarchical_pooling: true
        pooling_clusters: [50, 15]
        pooling_type: signature
        tabular_dim: 9
        tabular_hidden: 32
    optimizer:
      name: AdamW
      config:
        lr: 0.0005
        weight_decay: 0.0001
    criterion:
      name: FocalLoss
      config:
        gamma: 2.0
    early_stop:
      name: EarlyStopping
      config:
        patience: 25
        mode: max

