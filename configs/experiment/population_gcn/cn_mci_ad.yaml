general:
  out_dir: models/population_gcn/cn_mci_ad
  device: cuda
  num_epochs: 150
data:
  name: PopulationGraphDataset
  config:
    dataset_root: data/processed/splits/cn_mci_ad
    topology_root: data/processed/population_topology/cn_mci_ad
model:
  name: PopulationGCN
  config:
    gnn_name: ChebNet
    gnn_parameters:
      in_channels: 128
      hidden_channels: &hidden_channels 16
      num_layers: 6
      out_channels: *hidden_channels
      dropout: &dropout 0.02
      act: relu
      K: 3
      normalization: sym
    hidden_size: *hidden_channels
    dropout: *dropout
    num_classes: 3
criterion:
  name: FocalLoss
  config:
    alpha: [0.276, 0.145, 0.579]
    gamma: 2
optimizer:
  name: AdamW
  config: 
    lr: 0.01
early_stop:
  name: EarlyStopping
  config:
    verbose: True
    patience: 10
    path: model.pt
scheduler:
  name: HuggingFaceCosineScheduler  
  config: 
    num_warmup_epochs: 1
metrics:
  acc:
    name: MulticlassAccuracy
    config:
      num_classes: &num_classes 3
      average: &average macro
  f1-score:
    name: MulticlassF1Score
    config:
      num_classes: *num_classes
      average: *average
  auc:
    name: MulticlassAUROC
    config: 
      num_classes: *num_classes
      average: *average
