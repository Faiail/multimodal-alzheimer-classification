general:
  out_dir: models/hi_gnn/mci_ad
  device: cuda
  pbar: true
  num_epochs: 150
data:
  name: BiGraphDataset
  config:
    topology_root: data/processed/population_topology/mci_ad
    roi_feature_root: data/processed/roi-features
    dataset_root: data/processed/splits/mci_ad
    topk: 16
loader:
  batch_size: 128
  drop_last: false
  num_workers: 8
model:
  name: HiGNN
  config:
    backbone_params:
      gnn_name: GCN
      gnn_params:
        in_channels: 4
        hidden_channels: 128
        out_channels: 128
        num_layers: 2
        dropout: 0.2
        norm: batchnorm
      hidden_dim: 128
      out_dim: 128
    classifier_params:
      gnn_name: ChebNet
      gnn_params:
        in_channels: 128
        hidden_channels: 16
        out_channels: 2
        num_layers: 2
        K: 3
        dropout: 0.5
        act: relu
criterion:
  name: CrossEntropyLoss
  config:
    weight:
    - 0.7664
    - 1.4384
optimizer:
  name: AdamW
  config:
    lr: 0.001
    weight_decay: 0.0005
early_stop:
  name: EarlyStopping
  config:
    verbose: true
    patience: 10
    path: model.pt
scheduler:
  name: StepLR
  config:
    step_size: 20
    gamma: 0.5
metrics:
  acc:
    name: MulticlassAccuracy
    config:
      num_classes: 2
      average: macro
  f1-score:
    name: MulticlassF1Score
    config:
      num_classes: 2
      average: macro
  auc:
    name: MulticlassAUROC
    config:
      num_classes: 2
      average: macro
