general:
  out_dir: models/brain_gnn/cn_mci
  device: cuda
  pbar: true
  num_epochs: 150
data:
  train:
    name: BrainGraphDataset
    config:
      graph_root: data/processed/brain_graphs
      fold_root: data/processed/splits/cn_mci
      split: train
  val:
    name: BrainGraphDataset
    config:
      graph_root: data/processed/brain_graphs
      fold_root: data/processed/splits/cn_mci
      split: val
  test:
    name: BrainGraphDataset
    config:
      graph_root: data/processed/brain_graphs
      fold_root: data/processed/splits/cn_mci
      split: test
loader:
  batch_size: 128
  shuffle: true
  drop_last: false
  num_workers: 8
model:
  name: BrainGNN
  config:
    num_nodes: 166
    in_channels: 4
    hidden_dim1: 32
    hidden_dim2: 32
    num_classes: 2
    num_communities: 8
    pooling_ratio: 0.5
    mlp_hidden_dim: 8
criterion:
  name: BrainGNNLoss
  config:
    weight:
    - 1.447
    - 0.764
    lambda1: 0.1
    lambda2: 0.1
    eps: 1e-7
optimizer:
  name: AdamW
  config:
    lr: 0.001
    weight_decay: 0.005
early_stop:
  name: EarlyStopping
  config:
    verbose: true
    patience: 10
    path: model.pt
scheduler:
  name: StepLR
  config:
    step_size: 20
    gamma: 0.5
metrics:
  acc:
    name: MulticlassAccuracy
    config:
      num_classes: 2
      average: macro
  f1-score:
    name: MulticlassF1Score
    config:
      num_classes: 2
      average: macro
  auc:
    name: MulticlassAUROC
    config:
      num_classes: 2
      average: macro
