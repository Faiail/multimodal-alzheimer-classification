general:
  out_dir: models/vit/cn_mci
  device: cuda
  pbar: true
  num_epochs: 150
data:
  train:
    name: VisualDataset
    config:
      multimodal_root: data/processed/multimodal-tensors
      fold_root: data/processed/splits/cn_mci
      split: train
  val:
    name: VisualDataset
    config:
      multimodal_root: data/processed/multimodal-tensors
      fold_root: data/processed/splits/cn_mci
      split: val
  test:
    name: VisualDataset
    config:
      multimodal_root: data/processed/multimodal-tensors
      fold_root: data/processed/splits/cn_mci
      split: test
loader:
  batch_size: 64
  shuffle: true
  drop_last: false
  num_workers: 8
model:
  name: ViT
  config:
    spatial_dims: 3
    in_channels: 2
    img_size:
    - 128
    - 128
    - 128
    patch_size:
    - 16
    - 16
    - 16
    num_classes: 2
criterion:
  name: CrossEntropyLoss
  config:
    weight:
    - 1.2795
    - 0.8207
optimizer:
  name: AdamW
  config:
    lr: 0.0002
    weight_decay: 0.0001
early_stop:
  name: EarlyStopping
  config:
    verbose: true
    patience: 10
    path: model.pt
scheduler:
  name: CosineAnnealingLR
  config:
    T_max: 50
    eta_min: 1.0e-06
metrics:
  acc:
    name: MulticlassAccuracy
    config:
      num_classes: 2
      average: macro
  f1-score:
    name: MulticlassF1Score
    config:
      num_classes: 2
      average: macro
  auc:
    name: MulticlassAUROC
    config:
      num_classes: 2
      average: macro
