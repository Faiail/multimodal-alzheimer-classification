general:
  out_dir: models/mm_gnn/cn_mci
  device: cuda
  num_epochs: 150
data:
  name: MMGNNDataset
  config:
    graph_root: data/processed/mm_gnn/cn_mci
    split_root: data/processed/splits/cn_mci
    dataset: data/processed/population_topology/cn_mci/population_dataset.csv
model:
  name: MMGNN
  config:
    mri_branch_parameters:
      gnn_name: FastChebNet
      gnn_config: &id001
        num_layers: 2
        in_channels: 13695
        hidden_channels: 32
        out_channels: 2
        act: relu
        K: 3
        dropout: 0.5
    pet_branch_parameters:
      gnn_name: FastChebNet
      gnn_config: *id001
criterion:
  name: CrossEntropyLoss
  config:
    weight:
    - 1.2795
    - 0.8207
optimizer:
  name: AdamW
  config:
    lr: 0.0001
    weight_decay: 0.0001
early_stop:
  name: EarlyStopping
  config:
    verbose: true
    patience: 10
    path: model.pt
scheduler:
  name: CosineAnnealingLR
  config:
    T_max: 50
    eta_min: 1.0e-06
metrics:
  acc:
    name: MulticlassAccuracy
    config:
      num_classes: 2
      average: macro
  f1-score:
    name: MulticlassF1Score
    config:
      num_classes: 2
      average: macro
  auc:
    name: MulticlassAUROC
    config:
      num_classes: 2
      average: macro
