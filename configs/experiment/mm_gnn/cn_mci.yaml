general:
  out_dir: models/mm_gnn/cn_mci
  device: cuda
  num_epochs: 150
data:
  name: MMGNNDataset
  config:
    graph_root: data/processed/mm_gnn/cn_mci
    split_root: data/processed/splits/cn_mci
    dataset: data/processed/population_topology/cn_mci/population_dataset.csv
model:
  name: MMGNN
  config:
    mri_branch_parameters:
      gnn_name: &gnn_name FastChebNet
      gnn_config: &gnn_config
        num_layers: 2
        in_channels: 13695
        hidden_channels: 32
        out_channels: &num_classes 1
        act: relu
        K: 3
        dropout: 0.5
    pet_branch_parameters:
      gnn_name: *gnn_name
      gnn_config: *gnn_config
criterion:
  name: FocalLoss
  config:
    alpha: 0.345
    gamma: 2
optimizer:
  name: AdamW
  config: 
    lr: 1e-4
early_stop:
  name: EarlyStopping
  config:
    verbose: True
    patience: 10
    path: model.pt
scheduler:
  name: HuggingFaceCosineScheduler  
  config: 
    num_warmup_epochs: 1
metrics:
  acc:
    name: BinaryAccuracy
  f1-score:
    name: BinaryF1Score
  auc:
    name: BinaryAUROC
