general:
  out_dir: models/mm_gnn/cn_mci_ad
  device: cuda
  num_epochs: 150
data:
  name: MMGNNDataset
  config:
    graph_root: data/processed/mm_gnn/cn_mci_ad
    split_root: data/processed/splits/cn_mci_ad
    dataset: data/processed/population_topology/cn_mci_ad/population_dataset.csv
model:
  name: MMGNN
  config:
    mri_branch_parameters:
      gnn_name: &gnn_name FastChebNet
      gnn_config: &gnn_config
        num_layers: 2
        in_channels: 13695
        hidden_channels: 32
        out_channels: &num_classes 3
        act: relu
        K: 3
        dropout: 0.5
    pet_branch_parameters:
      gnn_name: *gnn_name
      gnn_config: *gnn_config
criterion:
  name: FocalLoss
  config:
    alpha: [0.276, 0.145, 0.579]
    gamma: 2
optimizer:
  name: AdamW
  config: 
    lr: 1e-4
early_stop:
  name: EarlyStopping
  config:
    verbose: True
    patience: 10
    path: model.pt
scheduler:
  name: HuggingFaceCosineScheduler  
  config: 
    num_warmup_epochs: 1
metrics:
  acc:
    name: MulticlassAccuracy
    config:
      num_classes: *num_classes
      average: &average macro
  f1-score:
    name: MulticlassF1Score
    config:
      num_classes: *num_classes
      average: *average
  auc:
    name: MulticlassAUROC
    config: 
      num_classes: *num_classes
      average: *average
